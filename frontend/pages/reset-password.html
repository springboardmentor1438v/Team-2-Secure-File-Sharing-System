<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SecureFS | Reset Password</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#0f172a;
    overflow:hidden;

}

body::before{

    content:"";
    position:absolute;
    width:420px;
    height:420px;
    background:#3b82f6;
    border-radius:50%;
    filter:blur(170px);
    left:-100px;
    top:-100px;
    opacity:.45;

}

body::after{

    content:"";
    position:absolute;
    width:420px;
    height:420px;
    background:#2563eb;
    border-radius:50%;
    filter:blur(170px);
    right:-100px;
    bottom:-100px;
    opacity:.35;

}

.card{

    position:relative;
    width:500px;
    background:#1e293b;
    border-radius:25px;
    padding:35px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    z-index:1;

}

.logo{

    text-align:center;
    margin-bottom:12px;

}

.logo i{

    font-size:48px;
    color:#4f86ff;

}

.logo h2{

    color:white;
    font-size:42px;
    margin-top:10px;

}

.subtitle{

    text-align:center;
    color:#cbd5e1;
    font-size:18px;
    margin-bottom:30px;

}

.form-group{

    margin-bottom:22px;

}

label{

    display:block;
    color:white;
    font-size:18px;
    font-weight:600;
    margin-bottom:10px;

}

.input-box{

    position:relative;

}

.input-box i.left{

    position:absolute;
    left:20px;
    top:50%;
    transform:translateY(-50%);
    color:#cbd5e1;
    font-size:18px;

}

.input-box i.toggle{

    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    color:#cbd5e1;
    cursor:pointer;
    font-size:18px;

}

.input-box input{

    width:100%;
    height:60px;
    border:none;
    outline:none;
    border-radius:16px;
    background:#374151;
    color:white;
    font-size:18px;
    padding:0 55px;
    transition:.3s;

}

.input-box input::placeholder{

    color:#cbd5e1;

}

.input-box input:focus{

    border:1px solid #4f86ff;
    box-shadow:0 0 15px rgba(79,134,255,.35);

}

.btn{

    width:100%;
    height:60px;
    border:none;
    border-radius:16px;
    margin-top:8px;
    background:linear-gradient(135deg,#2563eb,#4f86ff);
    color:white;
    font-size:22px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;

}

.btn:hover{

    transform:translateY(-2px);
    box-shadow:0 15px 35px rgba(37,99,235,.4);

}

.back{

    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:white;
    margin-top:22px;
    font-size:18px;

}

.back:hover{

    color:#4f86ff;

}

@media(max-width:600px){

.card{

    width:92%;
    padding:28px;

}

.logo h2{

    font-size:34px;

}

.subtitle{

    font-size:16px;

}

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

<i class="fa-solid fa-shield-halved"></i>

<h2>Reset Password</h2>

</div>

<p class="subtitle">

Create a new secure password

</p>

<form id="resetForm">

<div class="form-group">

<label>New Password</label>

<div class="input-box">

<i class="fa-solid fa-lock left"></i>

<input
type="password"
id="password"
placeholder="Enter New Password"
required>

<i class="fa-solid fa-eye toggle"
onclick="togglePassword('password',this)"></i>

</div>

</div>

<div class="form-group">

<label>Confirm Password</label>

<div class="input-box">

<i class="fa-solid fa-lock left"></i>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<i class="fa-solid fa-eye toggle"
onclick="togglePassword('confirmPassword',this)"></i>

</div>

</div>

<button
type="submit"
class="btn">

Reset Password

</button>

</form>

<a href="login.html" class="back">

<i class="fa-solid fa-arrow-left"></i>

Back to Login

</a>

</div>

<script>

function togglePassword(id,icon){

const input=document.getElementById(id);

if(input.type==="password"){

input.type="text";

icon.classList.remove("fa-eye");

icon.classList.add("fa-eye-slash");

}

else{

input.type="password";

icon.classList.remove("fa-eye-slash");

icon.classList.add("fa-eye");

}

}

</script>

<script src="../js/reset-password.js"></script>

</body>
</html>
