<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureFS | Forgot Password</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Poppins",sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#0f172a;
            overflow:hidden;
        }

        body::before{
            content:"";
            position:absolute;
            width:450px;
            height:450px;
            background:#3b82f6;
            border-radius:50%;
            filter:blur(180px);
            top:-120px;
            left:-120px;
            opacity:.45;
        }

        body::after{
            content:"";
            position:absolute;
            width:450px;
            height:450px;
            background:#2563eb;
            border-radius:50%;
            filter:blur(180px);
            bottom:-120px;
            right:-120px;
            opacity:.35;
        }

        .card{
            position:relative;
            width:650px;
            background:#1e293b;
            border:1px solid rgba(255,255,255,.08);
            border-radius:28px;
            padding:50px;
            box-shadow:0 25px 60px rgba(0,0,0,.45);
            z-index:1;
        }

        .logo{
            text-align:center;
            margin-bottom:15px;
        }

        .logo i{
            font-size:48px;
            color:#4f86ff;
        }

        .logo h2{
            color:#fff;
            margin-top:12px;
            font-size:52px;
            font-weight:700;
        }

        .subtitle{
            text-align:center;
            color:#cbd5e1;
            font-size:22px;
            margin-bottom:45px;
        }

        .form-group{
            margin-bottom:30px;
        }

        label{
            display:block;
            color:#fff;
            font-size:22px;
            font-weight:600;
            margin-bottom:12px;
        }

        .input-box{
            position:relative;
        }

        .input-box i{
            position:absolute;
            left:22px;
            top:50%;
            transform:translateY(-50%);
            color:#cbd5e1;
            font-size:24px;
        }

        .input-box input{
            width:100%;
            height:76px;
            background:#374151;
            border:1px solid rgba(255,255,255,.08);
            border-radius:18px;
            padding-left:70px;
            font-size:24px;
            color:#fff;
            outline:none;
            transition:.3s;
        }

        .input-box input::placeholder{
            color:#cbd5e1;
        }

        .input-box input:focus{
            border-color:#4f86ff;
            box-shadow:0 0 15px rgba(79,134,255,.35);
        }

        .btn{
            width:100%;
            height:78px;
            border:none;
            border-radius:18px;
            background:linear-gradient(135deg,#2563eb,#4f86ff);
            color:#fff;
            font-size:28px;
            font-weight:700;
            cursor:pointer;
            transition:.3s;
            box-shadow:0 18px 40px rgba(37,99,235,.35);
        }

        .btn:hover{
            transform:translateY(-2px);
            box-shadow:0 24px 50px rgba(37,99,235,.45);
        }

        .back{
            display:inline-flex;
            align-items:center;
            gap:10px;
            margin-top:28px;
            color:#fff;
            text-decoration:none;
            font-size:24px;
            transition:.3s;
        }

        .back:hover{
            color:#4f86ff;
        }

        @media(max-width:700px){

            .card{
                width:92%;
                padding:35px 25px;
            }

            .logo h2{
                font-size:38px;
            }

            .subtitle{
                font-size:18px;
            }

            .btn{
                font-size:22px;
            }

            .input-box input{
                font-size:20px;
            }

            .back{
                font-size:20px;
            }

        }

    </style>
</head>
<body>

<div class="card">

    <div class="logo">
        <i class="fa-solid fa-shield-halved"></i>
        <h2>Forgot Password</h2>
    </div>

    <p class="subtitle">
        Enter your registered email address
    </p>

    <form id="forgotForm">

        <div class="form-group">

            <label>Email</label>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your Email"
                    required>

            </div>

        </div>

        <button type="submit" class="btn">
            Verify Email
        </button>

    </form>

    <a href="login.html" class="back">
        <i class="fa-solid fa-arrow-left"></i>
        Back to Login
    </a>

</div>

<script src="../js/forgot-password.js"></script>

</body>
</html>
