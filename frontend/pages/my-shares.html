<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SecureFS | My Shared Files</title>

    <link rel="icon"
          href="../assets/images/logo.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="../css/my-shares.css">

</head>

<body>

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-shield-halved"></i>

            <span>SecureFS</span>

        </div>

        <ul>

            <li>

                <a href="dashboard.html">

                    <i class="fa-solid fa-chart-line"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="files.html">

                    <i class="fa-solid fa-folder"></i>

                    My Files

                </a>

            </li>

            <li>

                <a href="upload.html">

                    <i class="fa-solid fa-upload"></i>

                    Upload

                </a>

            </li>

            <li>

                <a href="folders.html">

                    <i class="fa-solid fa-folder-tree"></i>

                    Folders

                </a>

            </li>

            <li>

                <a href="shared.html">

                    <i class="fa-solid fa-share-nodes"></i>

                    Shared With Me

                </a>

            </li>

            <li class="active">

                <a href="my-shares.html">

                    <i class="fa-solid fa-share-from-square"></i>

                    My Shared Files

                </a>

            </li>

            <li>

                <a href="#"
                   id="logoutBtn">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </a>

            </li>

        </ul>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>

                <h2>
                    My Shared Files
                </h2>

                <p>
                    Manage all files you have shared.
                </p>

            </div>

            <div class="user-box">

                <i class="fa-solid fa-user-circle"></i>

                <span id="username">
                    Loading...
                </span>

            </div>

        </header>


        <div
            id="sharesContainer"
            class="shares-grid">

        </div>

    </main>


    <div
        class="modal fade"
        id="editShareModal"
        tabindex="-1"
        aria-hidden="true">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Edit Share
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                    </button>

                </div>


                <div class="modal-body">

                    <input
                        type="hidden"
                        id="editShareId">


                    <div class="mb-3">

                        <label
                            for="editPermission"
                            class="form-label">

                            Permission

                        </label>

                        <select
                            id="editPermission"
                            class="form-select">

                            <option value="VIEW">
                                View Only
                            </option>

                            <option value="DOWNLOAD">
                                View & Download
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label
                            for="editExpiry"
                            class="form-label">

                            Expiry Date

                        </label>

                        <input
                            type="datetime-local"
                            id="editExpiry"
                            class="form-control">

                    </div>


                    <div class="mb-3">

                        <label
                            for="editDownloadLimit"
                            class="form-label">

                            Download Limit

                        </label>

                        <input
                            type="number"
                            id="editDownloadLimit"
                            class="form-control"
                            min="0"
                            value="0">

                        <small class="text-muted">

                            0 means unlimited downloads.

                        </small>

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="saveShareChanges()">

                        Save Changes

                    </button>

                </div>

            </div>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="../js/my-shares.js"></script>

</body>

</html>
